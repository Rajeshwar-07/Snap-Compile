# =============================================
# SnapCompile - Application Configuration
# =============================================

# Server Port
server.port=8080

# =============================================
# Database Configuration (Neon.tech PostgreSQL)
# Replace with your actual Neon.tech credentials
# =============================================
spring.datasource.url=jdbc:postgresql://YOUR_NEON_HOST/snapcompile?sslmode=require
spring.datasource.username=YOUR_NEON_USERNAME
spring.datasource.password=YOUR_NEON_PASSWORD
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# =============================================
# JWT Configuration
# =============================================
# Change this secret to a long random string in production
jwt.secret=snapcompile_super_secret_key_change_in_production_2024
jwt.expiration=86400000

# =============================================
# Judge0 API (Free tier - RapidAPI)
# Get your key at: https://rapidapi.com/judge0-official/api/judge0-ce
# =============================================
judge0.api.url=https://judge0-ce.p.rapidapi.com
judge0.api.key=YOUR_RAPIDAPI_KEY

# =============================================
# CORS - Allow React frontend
# =============================================
cors.allowed.origins=http://localhost:5173,https://your-vercel-app.vercel.app

# =============================================
# File Upload (for OCR photo upload)
# =============================================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Logging
logging.level.com.snapcompile=DEBUG
